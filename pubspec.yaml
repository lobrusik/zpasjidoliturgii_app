name: zpasjidoliturgii
description: "Aplikacja mobilna dla pasjonatów liturgii"
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.0+17

environment:
  sdk: '>=3.12.2 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI & Design
  cupertino_icons: ^1.0.2
  google_fonts: ^6.2.0
  cached_network_image: ^3.4.1
  flutter_markdown: ^0.6.18
  carousel_slider: ^5.1.2

  # State Management & Architecture
  flutter_bloc: ^9.0.0
  equatable: ^2.0.5
  go_router: ^14.0.0

  # Firebase & Backend
  firebase_core: ^3.1.0
  cloud_firestore: ^5.1.0
  firebase_auth: ^5.1.0
  google_sign_in: ^6.2.1
  firebase_crashlytics: ^4.0.1

  # Monetization & Subscriptions
  google_mobile_ads: ^9.1.0
  purchases_flutter: ^10.10.0

  # Multimedia & Utilities
  youtube_player_flutter: ^9.0.1
  youtube_player_iframe: ^6.0.2
  connectivity_plus: ^6.0.3
  url_launcher: ^6.3.2
  html_unescape: ^2.0.0
  universal_html: ^2.3.0
  intl: ^0.19.0
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1
  bloc_test: ^10.0.0
  mocktail: ^1.0.3
  fake_cloud_firestore: ^3.1.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/tarsycjusz/
    - assets/images/ksawery/
    - assets/images/xpawel/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo-app.png"
  adaptive_icon_background: "#141F1C"
  adaptive_icon_foreground: "assets/images/logo-app.png"