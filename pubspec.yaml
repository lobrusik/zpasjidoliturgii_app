name: zpasjidoliturgii
description: "A mobile application for liturgical learning and study plans."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1

environment:
  sdk: '>=3.12.2 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.2

  # Authorization and Database (Firebase)
  firebase_core: ^3.1.0
  cloud_firestore: ^5.1.0
  firebase_auth: ^5.1.0
  google_sign_in: ^6.2.1

  # State Management and Architecture
  flutter_bloc: ^9.0.0
  equatable: ^2.0.5

  # UI and Adds
  google_fonts: ^6.2.0
  cached_network_image: ^3.4.1

  go_router: ^14.0.0

  youtube_player_flutter: ^9.0.1

  firebase_crashlytics: ^4.0.1
  connectivity_plus: ^6.0.3
  carousel_slider: ^5.1.2
  
  url_launcher: ^6.3.2
  html_unescape: ^2.0.0
  youtube_player_iframe: ^6.0.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1


flutter:
  uses-material-design: true
  assets:
    - assets/images/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/icon_app.png"